name: Build dylib — fast lane (compile only)

# Iteration lane: compile the tweak and nothing else. No IPA download, no
# injection, no re-signing, no filebin upload.
#
# Why a separate workflow: the release lane (`build-ipa-with-orion.yml`) does
#   checkout → theos → brew → SwiftProtobuf → `make package` → fetch a 300 MB IPA
#   → cyan injection → assertions → upload
# and only the compile step actually depends on the code you just changed.
#
# ── What changes between iterations ──────────────────────────────────────────
# Of the five things injected into the IPA, only `EeveeSpotify.dylib` follows
# the source:
#   · Orion.framework            ← a pinned Orion.zip (sha256 recorded in the workflow)
#   · EeveeSwiftProtobuf.framework ← decided by swift-protobuf 1.29.0 alone (and cached here)
#   · zxPluginsInject.dylib      ← patched lane only, from the modules/zxPluginsInject submodule
#   · CydiaSubstrate.framework   ← shipped as an Orion dependency
# So "CI builds the dylib, the device is updated locally" loses nothing. The one
# exception is a `.strings` edit: that also changes `EeveeSpotify.bundle`, which
# lives outside Frameworks/ and needs no compiling - copy it from `layout/`.
#
# Usage:
#   1. Run this workflow (`debug: true` by default ⇒ `-Onone`, 2-4x faster);
#   2. Take `EeveeSpotify-<sha8>-<flavour>.dylib` from the artifact;
#   3. Swap it into `Payload/Spotify.app/Frameworks/EeveeSpotify.dylib` and sign.
#
# ⚠️ Do not ship a `debug: true` build: `-Onone` output is bigger and slower.
# It is fine for behaviour checks; use `debug: false` (release `-Osize`) when
# judging scrolling or animation timing.

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Iteration build (-Onone: 2-4x faster to compile, bigger and slower output - do not ship)"
        default: true
        type: boolean
      artifact:
        description: "What to upload: dylib only (for local injection), deb only, or both"
        default: dylib
        type: choice
        options:
          - dylib
          - deb
          - both

# Repeated runs: keep only the last one, so superseded queue time is not spent.
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"
  # brew's auto-update / cleanup / hints are pure overhead on a runner (tens of
  # seconds each run).
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'

      # Theos itself is not cached: it carries a pile of submodules and saves
      # about half a minute, which is not worth another "the cached theos may
      # differ from upstream" explanation.
      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      # ── EeveeSwiftProtobuf.framework: the second most expensive step ───────
      # `Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh` clones the pinned
      # apple/swift-protobuf and compiles it twice (arm64 + arm64e) with `-O`.
      # Its only inputs are the version, the arch and the deployment target - it
      # does not depend on this repository at all, so cache it. Bumping the
      # version invalidates the key automatically.
      - name: Cache EeveeSwiftProtobuf.framework
        id: protobuf
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/lib/iphone
          key: eeveeswiftprotobuf-${{ env.SWIFTPROTOBUF_VERSION }}-${{ runner.arch }}-v1

      - name: Build EeveeSwiftProtobuf.framework
        if: steps.protobuf.outputs.cache-hit != 'true'
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      # `make` without `package` compiles and links the dylib only. Packaging
      # runs dpkg-deb and staging, which is pointless when the IPA is assembled
      # locally ⇒ only `artifact: deb` / `both` take the `make package` path.
      - name: Build the tweak
        env:
          REPO_SLUG: ${{ github.repository }}
          DEBUG_BUILD: ${{ inputs.debug && '1' || '0' }}
        run: |
          set -euo pipefail
          echo "debug build: $DEBUG_BUILD, artifact: ${{ inputs.artifact }}"
          # Same as the release lane: NO_JBROOT=1 stays, the output is only used
          # as a source for the dylib.
          THEOS_PACKAGE_SCHEME=rootless NO_JBROOT=1 \
            make FINALPACKAGE=1 DEBUG="$DEBUG_BUILD"

      - name: Package the deb
        if: ${{ inputs.artifact != 'dylib' }}
        env:
          DEBUG_BUILD: ${{ inputs.debug && '1' || '0' }}
        run: |
          set -euo pipefail
          # The tweak is already built, so this only stages and packages.
          THEOS_PACKAGE_SCHEME=rootless NO_JBROOT=1 \
            make package FINALPACKAGE=1 DEBUG="$DEBUG_BUILD"
          DEB_PATH=$(find packages -name "com.eevee.spotify_*.deb" | head -1)
          [ -n "$DEB_PATH" ] || { echo "::error::deb not produced"; exit 1; }
          echo "DEB_PATH=$DEB_PATH" >> $GITHUB_ENV
          ls -la packages/

      - name: Collect the dylib
        run: |
          set -euo pipefail
          # The output directory depends on the schema and the arch
          # (`.theos/obj/`, `.theos/obj/debug/`, sometimes an extra arm64 level),
          # so try the known paths first and fall back to a tree search.
          SRC=$(ls -1 .theos/obj/EeveeSpotify.dylib .theos/obj/debug/EeveeSpotify.dylib 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            SRC=$(find .theos -type f -name 'EeveeSpotify.dylib' | head -1)
          fi
          [ -n "$SRC" ] || {
            echo "::error::no EeveeSpotify.dylib under .theos/ - this theos version may only stage on 'make'."
            echo "::error::Re-run with artifact: deb, which goes through 'make package' (about 15s longer, always produces one)."
            find .theos -maxdepth 3 -type d
            exit 1
          }

          FLAVOR=$([ "${{ inputs.debug }}" = "true" ] && echo debug || echo release)
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          OUT="EeveeSpotify-${SHORT_SHA}-${FLAVOR}.dylib"
          mkdir -p Outputs
          cp "$SRC" "Outputs/$OUT"
          echo "DYLIB=Outputs/$OUT" >> $GITHUB_ENV
          echo "dylib: $SRC -> Outputs/$OUT"

          # Record which flavour this is: it saves reading the inputs later.
          # A debug build is not stripped, so __DWARF is still there and the
          # symbol count is an order of magnitude higher.
          echo "== size / debug info =="
          ls -l "Outputs/$OUT" | awk '{print "size:", $5, "bytes"}'
          # `grep -c` exits 1 when nothing matches, which `set -e` would turn
          # into a failed step ⇒ guard it separately.
          DWARF=$(otool -l "Outputs/$OUT" | grep -c "__DWARF" || true)
          echo "__DWARF sections: ${DWARF:-0}"
          echo "symbols: $(nm -a "Outputs/$OUT" 2>/dev/null | wc -l | tr -d ' ')"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-dylib
          path: ${{ env.DYLIB }}
          if-no-files-found: error

      - name: Upload deb
        if: ${{ inputs.artifact != 'dylib' }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-deb
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      - name: Summarize
        if: ${{ success() }}
        run: |
          {
            echo "### Fast lane output"
            echo ""
            echo "- Flavour: \`${{ inputs.debug && 'debug (-Onone)' || 'release (-Osize)' }}\`"
            echo "- dylib: \`${{ env.DYLIB }}\` — replaces \`Payload/Spotify.app/Frameworks/EeveeSpotify.dylib\`"
            if [ "${{ inputs.artifact }}" != "dylib" ]; then
              echo "- deb: \`${{ env.DEB_PATH }}\`"
            fi
            echo ""
            echo "A \`.strings\` edit also changes \`EeveeSpotify.bundle\`; copy it from \`layout/\` (no build needed)."
          } >> $GITHUB_STEP_SUMMARY
