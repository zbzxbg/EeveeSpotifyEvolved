name: Bump version

# 手动触发：把本仓库**代码里**的版本一次改到位。
#
# 改两处（README 不动 —— 版本引用由维护者手改）：
#   · `control:Version`（deb / 两个 IPA workflow 在运行时读它）；
#   · `Tweak.x.swift` 的 `static let version`（设置页与启动时打印的版本号）。
#
# 代码里不再有 build number：设置页只显示 `v2.0.0-beta`，启动日志也只写版本。
#
# 版本允许预发布后缀：`2.0.0-beta` / `2.0.0-rc.1`。输入带 `v` 前缀也能用
# （`v2.0.0-beta`）—— 脚本会去掉：设置页自己会拼 `"v\(version)"`，而 Debian 的
# `Version:` 字段不用这个前缀。
#
# 实际改文件的是 `Scripts/bump-version.py`；本 workflow 只负责校验输入、跑脚本、
# 可选地提交并推送。改版本是发布动作，所以手动触发，不做 push 自动改。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version: X.Y.Z or X.Y.Z-beta (a leading v is stripped)"
        required: true
        type: string
      commit:
        description: "Commit and push (uncheck to only print the diff)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump control and Tweak.x.swift
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 Scripts/bump-version.py --version "$INPUT_VERSION"

          # 把脚本**实际写进去**的值带回后面的步骤（输入带 v 时脚本会去掉前缀）。
          VERSION=$(grep -m1 'static let version = ' Sources/EeveeSpotify/Tweak.x.swift \
            | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Show the diff
        run: |
          git diff --stat
          git diff -- control Sources/EeveeSpotify/Tweak.x.swift

      - name: Commit and push
        if: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git config user.name "zbzxbg"
          git config user.email "yuanhainigu@outlook.com"
          # 只 add 这两个文件：脚本不应该动别的东西，也不要把 README 带进来。
          git add control Sources/EeveeSpotify/Tweak.x.swift
          if git diff --cached --quiet; then
            echo "Nothing to commit — control and Tweak.x.swift are already at $VERSION."
            exit 0
          fi
          git commit -m "Version: bump to $VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
