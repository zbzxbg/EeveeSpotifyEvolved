name: Logic tests

# 为什么单独一个 workflow：这个项目平时只在 macOS 上编译（Theos + Xcode），
# 但有几个测试是**纯 Foundation** 的，不需要设备也不需要 Theos。放在 CI 的意义是：
# 维护者只有 Windows + iPhone（没有 Mac）时，逻辑回归仍然有人替我们跑。
#
# 覆盖范围故意收窄：只跑"编译它自己 + 被测的那个文件"就能成立的那些测试。
# 需要 UIKit / Orion / Theos 的测试不能进这里。
#
# ⚠️ runner 用 **macOS**，不是 ubuntu：
#   一开始用 ubuntu-latest + swift-actions/setup-swift@v2 装 5.9，CI 直接 404 ——
#   那个 action 去 swift.org 取 "swift-5.9-RELEASE-ubuntu-24.04"，而 5.9 当年没有
#   24.04 的包（ubuntu-latest 已经滚到 24.04）。macOS runner 自带 Xcode 工具链，
#   `swiftc` 本来就在，不用下载任何东西，也就没有版本/发行版错配这一整类问题。

on:
  workflow_dispatch:
  push:

jobs:
  logic:
    runs-on: macos-latest

    # 守卫脚本的提示是中文 ⇒ 固定 stdout 编码，免得 runner 的 locale 是 C 时
    # Python 抛 UnicodeEncodeError，把"代码有问题"变成"环境有问题"的假红。
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain check
        run: swiftc --version

      # ── 语法门（2026-10-16 加，实测 run #291 = 373 个文件 1m28s 全过）────────────
      #
      # `swiftc -parse` 只做**语法**分析、**不解析 import** ⇒ 它能把带 UIKit / Orion 的
      # 视图文件也过一遍 —— 那几个文件本机编不了、CI 里那些 swiftc 步骤也编不了，
      # 这里是它们**唯一**的语法检查。
      #
      # 它挡的正是历史上"白跑一轮"的那两类：**非法转义**（`\uXXXX`，Swift 只认 `\u{XXXX}`）
      # 与**括号/引号不配** —— 两者都是纯语法错，`-parse` 一定报。
      #
      # ⚠️ **逐个文件**跑，不是一次传 370 个：一个文件的错不会掩盖别的，日志里也直接写明是哪个文件。
      # ⚠️ 末尾 `total > 200` 是**防空跑**：`find` 要是因为路径写错返回空集，
      #    这个脚本会"全过"（`fails` 恒为 0）—— 那种绿比红还坏。
      - name: Syntax gate — swiftc -parse over every Swift source
        run: |
          fails=0
          total=0
          while IFS= read -r -d '' f; do
            total=$((total+1))
            if ! swiftc -parse -suppress-warnings "$f" > /tmp/one.out 2>&1; then
              fails=$((fails+1))
              echo "---- PARSE FAIL: $f"
              head -6 /tmp/one.out
            fi
          done < <(find Sources Tests -name '*.swift' -print0)
          echo "parsed $total file(s), failures: $fails"
          test "$total" -gt 200
          test "$fails" -eq 0

      # ── 守卫：六条"必然编译错"的纯文本检查（2026-10-16 接进来，2026-10-17 补第六条）──────
      #
      # 这五个脚本从 2026-10-01 起就是"每轮改完手动跑一遍"的纪律，但它们**从来没进过任何
      # workflow**（全仓 grep 只有注释提到它们）⇒ 一次普通 push 之后没人拦这五类错，
      # 只有等你真去打包 IPA 那一轮才炸 —— 而本机（Windows）**没有 Swift 工具链**，
      # 带 UIKit / Orion 的视图文件在本机永远编不了，这几个脚本是那批文件**唯一的自动反馈**。
      #
      # 放进来的代价约 8 秒（实测：brace 1.1s / string 0.6s / member 3.3s / orion 2.3s /
      # l10n 0.4s），收益是**每一次 push 都跑**，而不是靠人记得。
      #
      # ⚠️ 那五个脚本**都不扫 `Tests/`**（那里的 `main.swift` 是断言程序，不是被注入的源码）
      #    —— 所以最后单独给 `Tests/` 补一条括号/字符串检查。
      #
      # ★ 2026-10-17 追加第六条（真机 build 现场）：`swift_import_check.py`
      #   ——「用了 Foundation 的符号却没 import Foundation」。
      #   现场：`ExperimentsOptions.swift` 一直只有 Bool 字段（`Codable`/`Decoder` 在 stdlib 里）
      #   ⇒ 不 import 也能编过；加了一句 `Locale.current.region?.identifier` 之后真机直接报
      #   `cannot find 'Locale' in scope` / `cannot find 'TimeZone' in scope`。
      #   上面那五条**都挡不住**，`swiftc -parse` 也挡不住（`-parse` 不解析 import）——
      #   而本机没有 Swift 工具链，这类错只能等真机 build 才暴露。这一条填的就是这个洞。
      #   它同时扫 `Sources/` 与 `Tests/`，所以和上面五条的扫描范围不一样。
      - name: Guard — balanced braces / strings (Sources)
        run: python3 Tools/eevee-hookfinder/swift_brace_check.py
      - name: Guard — string literal escapes (Sources)
        run: python3 Tools/eevee-hookfinder/swift_string_check.py
      - name: Guard — static member scopes (Sources)
        run: python3 Tools/eevee-hookfinder/swift_member_check.py
      # 上面那条自己的假阳性回归：闭包参数（带返回类型）与 `case` 模式绑定都是绑定、不是引用，
      # 必须不报；真·跨文件裸引用必须照旧报出，否则这条 guard 会开始吞真问题。
      - name: Guard — static member check fixtures
        run: python3 Tests/Tools/MemberCheckFixtures/test.py
      - name: Guard — Orion hooks (import / orig / Group / final)
        run: python3 Tools/eevee-hookfinder/orion_hook_guard.py
      - name: Guard — l10n keys
        run: python3 Tools/l10n_lint.py --quiet
      - name: Guard — missing Foundation imports (Sources + Tests)
        run: python3 Tools/eevee-hookfinder/swift_import_check.py
      - name: Guard — balanced braces / strings (Tests)
        run: python3 Tools/eevee-hookfinder/swift_brace_check.py Tests

      - name: Telemetry classification
        run: |
          swiftc Tests/TelemetryClassification/main.swift \
                 Sources/EeveeSpotify/Privacy/TelemetryEndpointRules.swift \
                 -o telemetry-tests
          ./telemetry-tests

      - name: Flag override store
        run: |
          swiftc Tests/FlagOverrideStore/main.swift \
                 Sources/EeveeSpotify/Flags/FlagOverride.swift \
                 -o flag-override-tests
          ./flag-override-tests

      - name: URL ad classification (existing)
        run: |
          swiftc Tests/URLAdClassification/main.swift \
                 Sources/EeveeSpotify/Shared/Models/Extensions/URL+Extension.swift \
                 -o url-ad-tests
          ./url-ad-tests

      # ── 2026-10-03 补齐：下面这四条**本来只有 `builddeb.yml`（手动、要填 tag）会跑** ──
      #
      # 为什么必须搬到这里：本仓库没有 Mac，`builddeb.yml` 是 `workflow_dispatch` 手动的 ⇒
      # 一次普通 push 之后，这四块逻辑**没人替我们验**。而它们覆盖的正是最容易改坏的几处：
      #   · `DebugLogSanitizer` —— 日志脱敏（**隐私**，漏了就是把凭证写进导出日志）；
      #   · `BrowsitaSectionStripper` —— 广告/推广区块剥离；
      #   · `ServerSidedFeaturePolicy` / `BundledConfigurationPolicy` —— premium 伪装的边界
      #     （哪些账号属性**不许**伪装、用哪份随包配置快照）。
      #
      # 每一步的编译命令与 `builddeb.yml` 里那一步**逐字一致**（同一个被测文件 +
      # 同一个测试 main），所以两处的结论不会分叉。
      - name: Debug log redaction (privacy)
        run: |
          swiftc Sources/EeveeSpotify/Shared/Helpers/DebugLogSanitizer.swift \
                 Tests/DebugLogRedaction/main.swift \
                 -o debug-log-redaction-tests
          ./debug-log-redaction-tests

      - name: Browsita section stripper (ads / promos)
        run: |
          swiftc Sources/EeveeSpotify/Premium/Helpers/BrowsitaSectionStripper.swift \
                 Tests/BrowsitaSectionStripper/main.swift \
                 -o browsita-section-stripper-tests
          ./browsita-section-stripper-tests

      - name: Server-sided feature policy
        run: |
          swiftc Sources/EeveeSpotify/Premium/Helpers/ServerSidedFeaturePolicy.swift \
                 Tests/ServerSidedFeaturePolicy/main.swift \
                 -o server-sided-feature-policy-tests
          ./server-sided-feature-policy-tests

      - name: Bundled configuration policy
        run: |
          swiftc Sources/EeveeSpotify/Premium/Helpers/BundledConfigurationPolicy.swift \
                 Tests/BundledConfigurationPolicy/main.swift \
                 -o bundled-configuration-policy-tests
          ./bundled-configuration-policy-tests

      # 2026-10-13：SpicyLyrics 从内部 `/query`（SLObjPack 打包）搬到官方
      # `GET /v1/lyrics/<id>`（普通 JSON），中间那座桥是 `SLObjPackValue.fromJSON`；
      # 同时把音节拼接规则抽成 `SpicySyllableText` —— 它是**前瞻**语义
      # （看前一个音节的 IsPartOfWord），本仓库曾读反，实测 36% 的歌词行会拼错。
      # 这三个被测文件都是纯 Foundation，所以能进这里；`SpicyLyricsRepository`
      # 本身带 Orion/UIKit 依赖，进不来。
      - name: SpicyLyrics v1 JSON mapping + syllable join + attribution
        run: |
          swiftc Sources/EeveeSpotify/Lyrics/Repositories/SLObjPack.swift \
                 Sources/EeveeSpotify/Lyrics/Models/LyricsWordDto.swift \
                 Sources/EeveeSpotify/Lyrics/Models/SpicySyllableText.swift \
                 Sources/EeveeSpotify/Lyrics/Models/SpicyLineFilter.swift \
                 Sources/EeveeSpotify/Lyrics/Models/LyricsContributor.swift \
                 Sources/EeveeSpotify/Lyrics/Models/SpicyLyricsAttribution.swift \
                 Tests/SpicyLyricsJsonMapping/main.swift \
                 -o spicy-lyrics-json-mapping-tests
          ./spicy-lyrics-json-mapping-tests

      # 2026-10-18：间奏（三个呼吸点）的**纯逻辑**两层 ——
      # `LyricInterludeTimeline`（哪两句之间算间奏、这一拍该显示什么）与
      # `AppleMusicInterludeDotsPresentation`（三个点各多亮、整排缩放/淡出）。
      # 它们没有任何 UI 依赖，所以能进这里；渲染层 `AppleMusicInterludeRow` 要 SwiftUI，进不来。
      #
      # ⚠️ 这一步还有第二重意义：本仓库本机没有 Swift 工具链 ⇒ 这两个**新文件**在打包之前
      #    没有任何东西编译过它们。这里是唯一能在 IPA 构建之前把它们过一遍 `swiftc` 的地方。
      - name: Lyric interlude timeline + dots presentation
        run: |
          swiftc Sources/EeveeSpotify/Lyrics/AppleMusic/LyricModels.swift \
                 Sources/EeveeSpotify/Lyrics/AppleMusic/LyricInterlude.swift \
                 Sources/EeveeSpotify/Lyrics/AppleMusic/LyricInterludeTimeline.swift \
                 Sources/EeveeSpotify/Lyrics/AppleMusic/LyricVocalDurationEstimator.swift \
                 Sources/EeveeSpotify/Lyrics/AppleMusic/AppleMusicInterludeMotionProfile.swift \
                 Sources/EeveeSpotify/Lyrics/AppleMusic/AppleMusicInterludeDotsPresentation.swift \
                 Tests/LyricInterludeTimeline/main.swift \
                 -o lyric-interlude-tests
          ./lyric-interlude-tests

      # 2026-10-16：「歌词进播放器」那层的**相位机**（关 / 展开中 / 开 / 收起中）与三条窗口的规则
      # （`LyricsDoorPhase.swift`）。它把原来散在六个旗标里、在七八处各写一遍的判据收成一处。
      # 纯 Foundation，所以能进这里；视图层 `NowPlayingLyricsPlate.swift` 要 UIKit/Orion，进不来
      # —— 但那一层现在**只把 UI 事实喂给这套规则**，判定本身在这里被测着。
      - name: Lyrics door phase rules (player lyrics layer)
        run: |
          swiftc Sources/EeveeSpotify/Appearance/LyricsDoorPhase.swift \
                 Tests/LyricsDoorPhase/main.swift \
                 -o lyrics-door-phase-tests
          ./lyrics-door-phase-tests

      # 2026-10-18：**折行复核器**（`LyricLineBreakFitting`）—— 日志 104 的 Starboy 现场：
      # `text=394.4 layout=331.8 breaks=[]`（按预算本该折，CoreText 一个断点都没给）⇒ 折行那一侧
      # 量与渲染那一侧不是同一把尺子，断点太靠右 ⇒ 第一段仍超宽 ⇒ 渲染再折一次 ⇒ 屏幕上多出一行
      # （用户报的"额外换行"）。
      #
      # 复核器是**纯逻辑**（只吃一个"量这段宽度"的闭包）所以能进这里；真正调用它的
      # `TimedLyricTextBuilder` 要 UIKit/CoreText，进不来 —— 但"只加断点不删"与
      # "复核后每一段都放得下"这两条不变量在这里被钉住。
      - name: Lyric line break fitting (no extra line breaks)
        run: |
          swiftc Sources/EeveeSpotify/Lyrics/AppleMusic/LyricLineBreakFitting.swift \
                 Tests/LyricLineBreakFitting/main.swift \
                 -o lyric-line-break-fitting-tests
          ./lyric-line-break-fitting-tests

      # 2026-10-17：LRCLIB 的按行拆分（`LyricsLineSplitting`）—— 两条路原来都写
      # `components(separatedBy: "\n").dropLast()`：那是**假定响应末尾有换行**。
      # 没有尾换行的响应里，`dropLast()` 丢的是**最后一行真歌词**，而且静默
      # （日志只少一个数字，没有任何东西会变红）。纯 Foundation，所以能进这里。
      - name: Lyrics line splitting (LRCLIB trailing newline)
        run: |
          swiftc Sources/EeveeSpotify/Lyrics/Models/LyricsLineSplitting.swift \
                 Tests/LrclibLineSplitting/main.swift \
                 -o lrclib-line-splitting-tests
          ./lrclib-line-splitting-tests

      # 2026-10-31：新接的四个源（BiniLyrics / Unison / QQ 音乐 / 酷狗）都是"按名字搜、
      # 自己在结果里挑一条"。挑错的代价是把**别人的词**配到这首歌上（翻唱 / Live / 同曲异名），
      # 而且用户看不出来 —— 所以那四条判据（归一化 / 主艺人 / 歌手互相包含 / 时长容差）
      # 必须钉死。`LyricsMatch.swift` 只依赖 Foundation，所以能进这里。
      #
      # ⚠️ 这一步还有第二重意义：本机没有 Swift 工具链，`LyricsMatch.swift` 是这一轮
      #   新增的文件里唯一能在打包之前被 `swiftc` **类型检查**过的（其余几个都拖着
      #   LyricsDto / Compression，进不来）。
      - name: Lyrics match (title / artist / length)
        run: |
          swiftc Sources/EeveeSpotify/Lyrics/Models/LyricsMatch.swift \
                 Tests/LyricsMatch/main.swift \
                 -o lyrics-match-tests
          ./lyrics-match-tests

      # 2026-10-17：「SpicyLyrics 交叉验证」的**补词判据**（`LyricsCensorFill`）。
      # 三件事必须钉住：
      #   ① 检测正则 —— 上游的 `\b\*{3,}\b` 实测只命中 `f***k`，`my **** line` 一个都
      #      不命中 ⇒ 那个功能从来没真正接线过。现在必须是"任意 3+ 星号"。
      #   ② CJK 回归 —— 旧算法按空格切词，中日韩整行只有 1 个"词" ⇒ **任何**候选行都被
      #      当成匹配、整行被换成别的歌词。必须只换星号那一段。
      #   ③ 不猜 —— 锚点不足（整行星号）或替换词不唯一（`**** you`）时保持原样。
      # 纯 Foundation（无网络、无 DTO），所以能进这里。
      - name: Lyrics censor fill (Spicy Lyrics cross-validation)
        run: |
          swiftc Sources/EeveeSpotify/Lyrics/LyricsCensorFill.swift \
                 Tests/LyricsCensorFill/main.swift \
                 -o lyrics-censor-fill-tests
          ./lyrics-censor-fill-tests

      # 2026-10-17：AMLL TTML 的 **ruby 注音**（`<ruby>漢<rt>かん</rt></ruby>`）不能被当歌词 ——
      # `text()` 原来把 `rt` 里的读音也拼进正文，于是 ① 那一行多出读音；② 有逐词 span 的行
      # 更糟：`primaryText` 含读音、与词条拼接结果不一致 ⇒ mapper 的不变量失败 ⇒ **整行降级为逐行**
      # （逐词高亮消失）。这一步把"注音被剔除"与"没有注音的行不受影响"一起钉住。
      # 解析层是纯 Foundation（`XMLParser`），所以能进这里；mapper 那层要 `LyricsDto` 的依赖链，进不来。
      #
      # 2026-10-17 第二轮：AMLL 真正的 ruby 写法是 **`tts:ruby` 属性**（时间只挂在
      # `tts:ruby="text"` 上），不是 HTML 的 `<ruby>/<rt>` —— 两种都在测。
      # 顺带把 `LyricsBackgroundVocalDto`（副唱 DTO）也编进来，锁住 §A·24 新加的
      # `translation` 字段形状（它只依赖 `LyricsWordDto`，纯 Foundation）。
      - name: AMLL TTML ruby annotations + background-vocal DTO
        run: |
          swiftc Sources/EeveeSpotify/Lyrics/Models/Amll/AmllTtmlDocument.swift \
                 Sources/EeveeSpotify/Lyrics/Models/Amll/AmllTtmlParser.swift \
                 Sources/EeveeSpotify/Lyrics/Models/LyricsError.swift \
                 Sources/EeveeSpotify/Lyrics/Models/LyricsWordDto.swift \
                 Sources/EeveeSpotify/Lyrics/Models/LyricsBackgroundVocalDto.swift \
                 Sources/EeveeSpotify/Lyrics/Repositories/LyricsMarkers.swift \
                 Tests/AmllTtmlRuby/main.swift \
                 -o amll-ttml-ruby-tests
          ./amll-ttml-ruby-tests

      # 2026-10-17：Apple Music **官方** TTML（「实验 → 启用Apple Music官方TTML歌词」）
      # 的三处苹果特有写法 —— `<p>` 不带 begin/end（时间只在 span 上）、译文侧挂的
      # `for` 在 `<translation>` 容器上、背景人声 `ttm:role="x-bg"`。
      # 解析器与 AMLL 共用（不新增第二套），所以这里只是把"苹果那份文件长什么样"钉住。
      - name: Apple Music official TTML compatibility
        run: |
          swiftc Sources/EeveeSpotify/Lyrics/Models/Amll/AmllTtmlDocument.swift \
                 Sources/EeveeSpotify/Lyrics/Models/Amll/AmllTtmlParser.swift \
                 Sources/EeveeSpotify/Lyrics/Models/LyricsError.swift \
                 Sources/EeveeSpotify/Lyrics/Models/LyricsWordDto.swift \
                 Sources/EeveeSpotify/Lyrics/Models/LyricsBackgroundVocalDto.swift \
                 Sources/EeveeSpotify/Lyrics/Repositories/LyricsMarkers.swift \
                 Tests/AmllTtmlApple/main.swift \
                 -o amll-ttml-apple-tests
          ./amll-ttml-apple-tests

      # 2026-10-16：打开后"没词可画时写哪一句"的判定（`LyricsNoticePolicy`）。四种"没词"必须
      # 分开说 —— 混档就是用户能看见的误报（"歌词明明有、我们却说未找到"）。纯 Foundation。
      - name: Lyrics notice policy (what we say when there is nothing to draw)
        run: |
          swiftc Sources/EeveeSpotify/Appearance/LyricsNoticePolicy.swift \
                 Tests/LyricsNoticePolicy/main.swift \
                 -o lyrics-notice-policy-tests
          ./lyrics-notice-policy-tests

      # 2026-10-16：「歌词进播放器」的**状态机**（`LyricsDoor`）—— 那六个旗标的唯一存储，
      # 以及整组操作（点开 / 失败 / 重试 / 过期 / 收尾 / 离开页面）。它和相位规则一起编。
      - name: Lyrics door state machine (player lyrics layer)
        run: |
          swiftc Sources/EeveeSpotify/Appearance/LyricsDoorPhase.swift \
                 Sources/EeveeSpotify/Appearance/LyricsDoor.swift \
                 Tests/LyricsDoor/main.swift \
                 -o lyrics-door-tests
          ./lyrics-door-tests

      # 唯一一个**不是** swiftc 的测试（纯 Python，不需要工具链）。
      - name: Resolve-configuration snapshot
        run: python3 Tests/ResolveConfigurationSnapshot/test.py

      # 2026-10-17：真机日志分诊工具（`Tools/log_triage.py`）。B 组那几件（§3 歌单页搜索条 /
      # §4 折叠 / §12 关于艺人 / §16 间奏 / §17 阈值 / §18 NetEase / §23+§30 折行与 AMLL）
      # 全都等同一份日志；那个脚本把"该看什么"写成程序（只读、不联网、不进构建产物）。
      # 这里只做一次语法检查 —— 免得日志来了才发现脚本自己坏了。
      - name: Tool — log triage (python syntax)
        run: python3 -m py_compile Tools/log_triage.py
